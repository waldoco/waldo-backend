project_id = "oqcjjcytjvrckvylagsl"

[api]
schemas = ["public", "graphql_public", "waldo"]

# Sign-in codes are 6 digits (owner, 2026-10-24). This pins the local stack; the hosted project's
# Email OTP Length is set separately in the dashboard or the management API (mailer_otp_length).
[auth.email]
otp_length = 6

[auth.email.template.magic_link]
subject = "Your Waldo sign-in code"
content_path = "./supabase/templates/magic_link.html"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[functions.mint-agent-jwt]
verify_jwt = false

# Router-HMAC signed by the Worker; the function rejects unsigned calls itself.
[functions.oauth-proxy]
verify_jwt = false

