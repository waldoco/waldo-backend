name: deploy-staging

# DRAFT - NOT ENABLED. Owner decision 2026-09-26: deploys (wrangler) and supabase migrations
# run through the Mac lane until he explicitly approves the first automated run. This workflow
# therefore has NO push trigger yet: it runs only when he triggers it by hand
# (workflow_dispatch). Enabling auto-deploy = adding the commented `push` block below, and
# that edit ships only with his go-ahead.
#
# on:
#   push:
#     branches:
#       - beta-mvp
on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Apply supabase migrations to staging before the worker deploy'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.34.4

      - name: Install (frozen lockfile, release-age policy active)
        run: pnpm install --frozen-lockfile

      - name: Verify gates stay green on the exact head being deployed
        run: pnpm -r typecheck

      - name: Apply supabase migrations to staging (opt-in per run)
        if: inputs.run_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
        run: |
          pnpm dlx supabase@2.109.1 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          pnpm dlx supabase@2.109.1 db push --linked

      - name: Deploy worker to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @waldo/runtime exec wrangler deploy --env staging

# Required repo secrets (staging scope only; production stays Mac-lane until he says so):
#   CLOUDFLARE_API_TOKEN      - Workers:Edit on the staging worker only
#   CLOUDFLARE_ACCOUNT_ID
#   SUPABASE_ACCESS_TOKEN     - Supabase CLI auth
#   SUPABASE_DB_PASSWORD      - staging project db password
#   SUPABASE_STAGING_PROJECT_ID
# First-run checklist (owner, before the manual trigger):
#   1. Secrets above are set on the repo (staging-scoped token, not account-wide).
#   2. The staging wrangler environment exists in packages/runtime/wrangler.toml.
#   3. He has said the word on the first run. Then - and only then - trigger
#      Actions -> deploy-staging -> Run workflow with run_migrations=false.
