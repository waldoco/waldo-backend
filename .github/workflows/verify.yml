name: verify

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - beta-mvp
      - greenfield/harness-foundation
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.34.4

      - name: Install (frozen lockfile, release-age policy active)
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Start isolated Supabase Auth, REST, and database stack
        run: supabase start > /dev/null

      # Everything except the runtime vitest suite. The suite moved to the verify-runtime
      # matrix below: unsharded in one process, workerd dies at TEARDOWN after all tests pass
      # (every run 2026-09-25, incl. docs-only commits) - the lane's 4 shards exit cleanly (#154).
      - name: Verify (core)
        run: node scripts/guards/guard-package-manager.mjs && pnpm -r typecheck && pnpm verify:node && pnpm verify:supabase && pnpm verify:supabase:session-revocation && pnpm verify:guards

  # Matches the in-lane gate exactly: 4 shards, each a small process that exits cleanly.
  # Falsifier for coverage: the shard totals must sum to the full runtime test count.
  verify-runtime:
    name: Runtime tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.34.4

      - name: Install (frozen lockfile, release-age policy active)
        run: pnpm install --frozen-lockfile

      - name: Runtime tests
        working-directory: packages/runtime
        run: npx vitest run --shard=${{ matrix.shard }}/4

  verify-supabase:
    name: Supabase migrate-from-zero and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Start isolated database and apply migrations from zero
        run: supabase db start

      - name: Run schema contract and pgTAP tests
        run: supabase test db

      - name: Verify canonical migration ordering
        run: |
          node scripts/verify-supabase-migrations.mjs
          supabase migration list --local
          supabase db query --local --file supabase/fixtures/assert-canonical-migration-history.sql

      - name: Verify transitional 0006 with Project Woof helper present
        run: |
          supabase db reset --local --no-seed --version 20260709171953
          supabase db query --local --file supabase/fixtures/create-legacy-rls-auto-enable.sql
          supabase migration up --local
          supabase db query --local --file supabase/fixtures/assert-legacy-rls-auto-enable-hardened.sql
          supabase migration list --local
          supabase db query --local --file supabase/fixtures/assert-canonical-migration-history.sql
