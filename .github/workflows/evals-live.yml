name: evals-live

# The nightly eval suite in live mode: the chat model answers and an independent judge grades each trial.
# It skips cleanly unless the repository has the secrets WALDO_EVAL_OPENAI_KEY and WALDO_EVAL_ANTHROPIC_KEY and the
# variable WALDO_EVAL_JUDGE_MODEL. Spend cap: WALDO_EVAL_MAX_CALLS below bounds model calls (candidate plus both judges)
# for the whole run; the runner refuses the call past it and the card reports the budget as exhausted. It is set from
# `pnpm eval:plan` (evals/nightly/plan.ts), and a test holds it at or above the plan's suggestion. Cost per run and
# the first-run procedure: docs/evals/LIVE_BASELINE_RUNBOOK.md.
# GitHub runs schedules, and lists workflows for manual dispatch, from the default branch (main) only, so this
# workflow does nothing until it reaches main.
on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-live
  cancel-in-progress: false

jobs:
  live:
    name: Nightly eval (live)
    runs-on: ubuntu-latest
    # The suite runs trials one after another: up to about 1,515 candidate calls at several seconds each, plus the
    # judges, whose split calls for one trial run together. 360 minutes is the most a hosted runner allows.
    timeout-minutes: 360
    steps:
      - name: Check for eval keys
        id: keys
        env:
          OPENAI_KEY: ${{ secrets.WALDO_EVAL_OPENAI_KEY }}
          ANTHROPIC_KEY: ${{ secrets.WALDO_EVAL_ANTHROPIC_KEY }}
          JUDGE_MODEL: ${{ vars.WALDO_EVAL_JUDGE_MODEL }}
        run: |
          if [ -n "$OPENAI_KEY" ] && [ -n "$ANTHROPIC_KEY" ] && [ -n "$JUDGE_MODEL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live eval skipped: set secrets WALDO_EVAL_OPENAI_KEY and WALDO_EVAL_ANTHROPIC_KEY and variable WALDO_EVAL_JUDGE_MODEL to run it."
          fi

      - name: Checkout
        if: steps.keys.outputs.run == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        if: steps.keys.outputs.run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        if: steps.keys.outputs.run == 'true'
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.34.4

      - name: Install (frozen lockfile, release-age policy active)
        if: steps.keys.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run the nightly suite (live)
        if: steps.keys.outputs.run == 'true'
        working-directory: packages/runtime
        env:
          WALDO_EVAL_MODE: live
          WALDO_EVAL_TRIALS: '3'
          WALDO_EVAL_MAX_CALLS: '3800'
          WALDO_EVAL_JUDGE_MODE: split
          OPENAI_API_KEY: ${{ secrets.WALDO_EVAL_OPENAI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.WALDO_EVAL_ANTHROPIC_KEY }}
          WALDO_EVAL_JUDGE_MODEL: ${{ vars.WALDO_EVAL_JUDGE_MODEL }}
        run: WALDO_EVAL_OUT="$RUNNER_TEMP/scorecard.json" pnpm eval:nightly > /dev/null

      # Fails the run when the scorecard misses NIGHTLY_THRESHOLDS.live (evals/nightly/gate.ts).
      - name: Gate the scorecard
        id: gate
        if: steps.keys.outputs.run == 'true'
        working-directory: packages/runtime
        env:
          WALDO_EVAL_MODE: live
        run: pnpm exec tsx evals/nightly/report.ts "$RUNNER_TEMP/scorecard.json" "$RUNNER_TEMP/scorecard.md"

      - name: Publish the scorecard to the run summary
        if: ${{ !cancelled() && steps.gate.conclusion != 'skipped' }}
        run: cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"
