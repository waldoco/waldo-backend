name: evals

# The nightly eval suite in recorded mode, on PRs that can change how Waldo behaves. Recorded mode needs no keys and
# reaches no network; it proves every scenario still runs (it grades nothing). The scripted-model scenario suite runs
# on every PR in verify.yml. The live, graded run is evals-live.yml.
on:
  pull_request:
    paths:
      - 'packages/runtime/src/prompt/**'
      - 'packages/runtime/src/conversation/**'
      - 'packages/runtime/src/hooks/**'
      - 'packages/runtime/src/memory/**'
      - 'packages/contracts/**'
      - 'packages/runtime/evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recorded:
    name: Nightly eval (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.34.4

      - name: Install (frozen lockfile, release-age policy active)
        run: pnpm install --frozen-lockfile

      - name: Run the nightly suite (recorded)
        working-directory: packages/runtime
        env:
          WALDO_EVAL_MODE: recorded
        run: WALDO_EVAL_OUT="$RUNNER_TEMP/scorecard.json" pnpm eval:nightly > /dev/null

      # Fails the job when the scorecard misses NIGHTLY_THRESHOLDS.recorded (evals/nightly/gate.ts).
      - name: Gate the scorecard
        id: gate
        working-directory: packages/runtime
        env:
          WALDO_EVAL_MODE: recorded
        run: pnpm exec tsx evals/nightly/report.ts "$RUNNER_TEMP/scorecard.json" "$RUNNER_TEMP/scorecard.md"

      # One comment per PR, edited in place. The scorecard holds counts and class names only, never reply text.
      - name: Post the scorecard
        if: ${{ !cancelled() && steps.gate.conclusion != 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/scorecard.md"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- waldo-eval-scorecard -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$body"
          fi
