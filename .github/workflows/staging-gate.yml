name: staging-gate

# Read-only check after a staging deploy: what is deployed, is it healthy, how to roll back.
# Manual only. It never deploys, rolls back or writes; see docs/ops/STAGING_DEPLOY_GATE.md.
on:
  workflow_dispatch:
    inputs:
      expect_sha:
        description: Git SHA (7-40 hex) staging should be running; leave empty to only report
        required: false
        type: string

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.34.4
      - name: Install (frozen lockfile, for the pinned wrangler)
        run: pnpm install --frozen-lockfile
      - name: Gate logic tests
        run: node --test scripts/staging-gate.test.mjs
      - name: Staging gate
        env:
          EXPECT_SHA: ${{ inputs.expect_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$EXPECT_SHA" ]; then node scripts/staging-gate.mjs --expect-sha "$EXPECT_SHA"; else node scripts/staging-gate.mjs; fi
