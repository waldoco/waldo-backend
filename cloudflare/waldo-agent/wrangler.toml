name = "waldo-worker"
main = "src/index.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "WALDO_AGENT"
class_name = "WaldoAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WaldoAgent"]

[[r2_buckets]]
binding = "R2_WORKSPACE"
bucket_name = "waldo-workspace"

[[r2_buckets]]
binding = "R2_EPISODES"
bucket_name = "waldo-episodes"

# OTel — automatic tracing (zero code changes required)
# Traces: DO invocations, AI Gateway calls, R2 ops → Langfuse
[observability]
enabled = true
head_sampling_rate = 1

[[observability.destinations]]
name = "langfuse"
endpoint = "https://cloud.langfuse.com/api/public/otel"
# Auth: wrangler secret put LANGFUSE_SECRET_KEY

[vars]
ENVIRONMENT = "production"
MIN_APP_VERSION = "1.0.0"
SUPABASE_URL = "https://ogjgbudoedwxebxfgxpa.supabase.co"

# AI Gateway — all LLM calls route through here
# Base: https://gateway.ai.cloudflare.com/v1/31680869a0e27d263df99818ceca94fb/waldo
AI_GATEWAY_ACCOUNT_ID = "31680869a0e27d263df99818ceca94fb"
AI_GATEWAY_NAME = "waldo"

# Model routing
# primary (~95%): Gemma 4 27B via Workers AI (in-colocation, free egress)
WORKERS_AI_MODEL = "@cf/google/gemma-4-27b-a4b"
# reasoning (~5%): Claude Sonnet 4.6 (pattern analysis + Constellation)
ANTHROPIC_MODEL = "claude-sonnet-4-6"

# ── Required secrets (wrangler secret put <NAME>) ────────────────────────────
# ANTHROPIC_API_KEY          ← Claude Sonnet via AI Gateway
# SUPABASE_SERVICE_ROLE_KEY  ← Supabase REST calls from DO
# TELEGRAM_BOT_TOKEN         ← Telegram delivery
# WORKERS_AI_API_TOKEN       ← Gemma 4 27B via Workers AI
# CF_AIG_TOKEN               ← AI Gateway auth token
# LANGFUSE_SECRET_KEY        ← OTel export to Langfuse
# APNS_PRIVATE_KEY           ← .p8 file contents (iOS push)
# APNS_KEY_ID                ← 10-char from Apple Developer
# APNS_TEAM_ID               ← 10-char from Apple Developer
# APNS_BUNDLE_ID             ← com.waldo.health
# GOOGLE_CLIENT_SECRET       ← Google OAuth
# WHOOP_WEBHOOK_SECRET       ← WHOOP HMAC validation

# ── Staging environment ──────────────────────────────────────────────────────
[env.staging]
name = "waldo-worker-staging"
vars = { ENVIRONMENT = "staging", MIN_APP_VERSION = "0.0.1" }
