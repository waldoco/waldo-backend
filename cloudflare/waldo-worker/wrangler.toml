name = "waldo-worker"
main = "src/index.ts"
# HEY-71 pins current Workers runtime behavior for the bootstrap harness.
compatibility_date = "2026-06-07"

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "WALDO_AGENT"
class_name = "WaldoAgent"

[[migrations]]
tag = "v1_waldo_agent"
new_sqlite_classes = ["WaldoAgent"]

[vars]
ENVIRONMENT = "local"
SUPABASE_URL = "https://gororukpipahvpvsydwz.supabase.co"
WALDO_WORKER_URL = ""

[env.staging]
name = "waldo-worker-staging"
vars = { ENVIRONMENT = "staging", SUPABASE_URL = "https://gororukpipahvpvsydwz.supabase.co", WALDO_WORKER_URL = "" }

[[env.staging.durable_objects.bindings]]
name = "WALDO_AGENT"
class_name = "WaldoAgent"

[env.production]
name = "waldo-worker-production"
vars = { ENVIRONMENT = "production", SUPABASE_URL = "https://atywijhgfevryxhkemfu.supabase.co", WALDO_WORKER_URL = "" }

[env.production.durable_objects]
# Production WALDO_AGENT binding is deferred until production auth and runtime gates land.
bindings = []
